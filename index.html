<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cat's Kitchen</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="/public/cat-kitchen.mp3">
</head>
<!-- This is all the content -->
<body>
    <div class="music-controls">
        <button id="musicBtn">
            <span id="musicIcon">
                <i class="bi bi-volume-mute-fill"></i>
            </span>
        </button>
    </div>

    <audio id="bgMusic" loop>
        <source src="public/01 - boba date.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <header>
            <div class="pixel-cat"></div>
            <h1>The Cat's Kitchen</h1>
            <span class="subtitle">Custom Culinary Recipes for Neighborhood Felines</span>
        </header>

        <div class="form-section">
            <div class="input-group">
                <label>Cat Type or Description</label>
                <input type="text" id="catType" placeholder="e.g. Persian Cat, Siamese, etc.">
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Estimated Weight (Lbs/Kg)</label>
                    <input type="text" id="catWeight" placeholder="e.g. 6-7 Kg">
                </div>
                <div class="input-group">
                    <label>Vintage (Age/Birth Year)</label>
                    <input type="text" id="catAge" placeholder="e.g. 2 years old or Born around mid of October">
                </div>
            </div>

            <div class="input-group">
                <label>Primary Leisure Pursuit </label>
                <input type="text" id="catHobby" placeholder="e.g. Professional moth-watching">
            </div>

            <div class="input-group">
                <label>Key Notes and Observations</label>
                <textarea id="catNotes" rows="3" placeholder="Likes to stargaze..."></textarea>
            </div>

            <button id="submitBtn">GENERATE RECIPE, CHEF!</button>
        </div>

        <div id="loading" class="loading-spinner">
            Whisking me whiskers! Analyzing feline-tastic food...
        </div>

        <div id="resultArea">
            <div id="reportContent"></div>
            <div class="disclaimer">
                <strong>WARNING:</strong> This report is entirely for fun and generated by AI. Consult a real vet for actual cat food.
            </div>
        </div>
    </div>
    <!-- Customize animation -->
    <script src="script.js"></script>
</body>
</html>
